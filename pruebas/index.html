<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css">
    <title>Poke Api</title>
</head>
<body class="d-flex flex-column align-items-center min-vh-100">

  <div class="container custom-container py-4 border rounded shadow mt-4">
    <div class="mb-3">
      <input type="text" id="nombrePokemon" class="form-control" placeholder="Ingresa el nombre del Pokémon" required>
    </div>

    <div class="mb-3 text-center">
      <button onclick="buscarPokemon()" class="btn btn-sm btn-primary">Buscar 🔎</button>
    </div>

    <div class="text-center my-3" id="titleName"></div>

    <div class="text-center">
      <button onclick="saveFavorite()" type="button" class="btn btn-outline-warning">❤️</button>
    </div>
  </div>

  <!-- Contenedor de favoritos -->
  <div class="container mt-5">
    <h4 class="mb-3">Favoritos ❤️</h4>
    <div id="items" class="row favoritePokemons">
      <!-- Aquí se insertarán las tarjetas -->
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
